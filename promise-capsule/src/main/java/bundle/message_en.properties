# [소개]
intro.title=Welcome
intro.loggedOut=You’ve been logged out.
intro.slides=How Promise Capsule works
intro.slide1=Make a capsule and invite friends with one link.
intro.slide2=Everyone adds a letter and up to 3 photos. Others only see that you wrote.
intro.slide3=When the creator seals it, it locks. No one can see inside until the day.
intro.slide4=On the opening date, it opens for everyone at once.
intro.prev=Previous
intro.next=Next
intro.pause=Pause slideshow
intro.play=Play slideshow
intro.h1=Leave today together,<br>meet again on the promised day.
intro.lead=2 to 6 friends each put a letter and a few photos into one capsule, seal it, and open it together on the day you promised.
intro.start=Get started
intro.haveAccount=I already have an account
intro.inviteHint=Got an invite link? Just open it — you’ll join right after signing up.
intro.how=How it works
intro.step1.title=Create &amp; invite
intro.step1.body=Name the capsule, pick the opening date, and share one link in your group chat.
intro.step2.title=Everyone writes
intro.step2.body=One letter and up to 3 photos each. You can see who has written — not what.
intro.step3.title=Seal it
intro.step3.body=There’s no writing deadline. When everyone is done, the creator seals it — then no one can read or change anything until the day.
intro.step4.title=Open together
intro.step4.body=On the opening date, we’ll email you. Open it and read everyone’s letters together.
intro.promise=Our promise
intro.promise1.title=Truly locked
intro.promise1.body=Before the opening date, even a direct photo link won’t show anything. Changing your computer’s clock won’t open it.
intro.promise2.title=Kept a surprise
intro.promise2.body=Friends can see that you’ve written, never what you wrote — until the day.
intro.promise3.title=Yours to take back
intro.promise3.body=Changed your mind after sealing? You can erase your own letter and photos.
intro.cta.title=What will you open together?
intro.cta.body=Graduation, the last show of your club, the final night of a trip…
intro.cta.button=Create a capsule

